<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1284, initial-scale=1" />
  <title>TAME Space Compass App Store Sample</title>
  <style>
    :root {
      --w: 1284px;
      --h: 2778px;
      --ink: #111312;
      --muted: #66706b;
      --paper: #f8f5ec;
      --gold: #b99450;
      --deep: #07100d;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      background: #f8f5ec;
      font-family: "Hiragino Sans GB", "PingFang SC", "Songti SC", system-ui, sans-serif;
    }

    .stage {
      position: relative;
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 80% 17%, rgba(209, 187, 130, 0.26), transparent 26%),
        linear-gradient(142deg, rgba(255,255,255,0.96), rgba(246,242,232,0.9) 42%, rgba(226,219,203,0.72)),
        url("../background-source/03-silver-flow.jpg");
      background-size: cover;
      background-position: center;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.20) 38%, rgba(9, 17, 14, 0.05)),
        radial-gradient(circle at 28% 84%, rgba(10, 18, 14, 0.15), transparent 36%);
      pointer-events: none;
    }

    .brand {
      position: absolute;
      left: 94px;
      top: 86px;
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 5;
      color: rgba(17,19,18,0.9);
      letter-spacing: 0;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(145deg, #101310, #425145);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), 0 20px 44px rgba(0,0,0,0.18);
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 13px;
      border: 2px solid #d8bd78;
      border-radius: 50%;
    }

    .brand-text {
      display: grid;
      gap: 3px;
      font-size: 25px;
      line-height: 1;
      font-weight: 600;
    }

    .brand-text small {
      font-size: 15px;
      color: rgba(17,19,18,0.52);
      font-weight: 500;
    }

    .copy {
      position: absolute;
      left: 94px;
      top: 216px;
      width: 760px;
      z-index: 5;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      height: 42px;
      padding: 0 19px;
      border-radius: 999px;
      background: rgba(255,255,255,0.76);
      border: 1px solid rgba(160, 140, 92, 0.28);
      color: #78613b;
      font-size: 22px;
      font-weight: 650;
      box-shadow: 0 12px 42px rgba(56,49,36,0.08);
    }

    h1 {
      margin: 42px 0 0;
      font-family: "Songti SC", "Hiragino Mincho ProN", serif;
      font-size: 104px;
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: 0;
      color: #101210;
    }

    .sub {
      width: 640px;
      margin-top: 30px;
      font-size: 31px;
      line-height: 1.5;
      color: rgba(17,19,18,0.66);
      font-weight: 520;
      letter-spacing: 0;
    }

    .caption-row {
      display: flex;
      gap: 14px;
      margin-top: 34px;
      flex-wrap: wrap;
    }

    .caption {
      height: 54px;
      padding: 0 20px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      background: rgba(14, 24, 19, 0.88);
      color: rgba(255,255,255,0.92);
      font-size: 20px;
      font-weight: 620;
      box-shadow: 0 18px 42px rgba(0,0,0,0.17);
    }

    .caption.light {
      background: rgba(255,255,255,0.7);
      color: rgba(20,23,21,0.75);
      border: 1px solid rgba(30,30,22,0.08);
      box-shadow: 0 16px 36px rgba(74,61,36,0.08);
    }

    .orbital {
      position: absolute;
      right: -178px;
      top: 230px;
      width: 960px;
      height: 960px;
      border-radius: 50%;
      border: 1px solid rgba(180,148,80,0.23);
      z-index: 1;
    }

    .orbital::before,
    .orbital::after {
      content: "";
      position: absolute;
      inset: 88px;
      border-radius: 50%;
      border: 1px solid rgba(17,19,18,0.08);
      transform: rotate(18deg) scaleX(1.28);
    }

    .orbital::after {
      inset: 210px;
      border-color: rgba(180,148,80,0.18);
      transform: rotate(-32deg) scaleX(1.55);
    }

    .feature-card {
      position: absolute;
      z-index: 6;
      right: 88px;
      top: 716px;
      width: 314px;
      min-height: 136px;
      padding: 24px 26px;
      border-radius: 28px;
      background: rgba(255,255,255,0.74);
      border: 1px solid rgba(255,255,255,0.88);
      box-shadow: 0 34px 78px rgba(24, 31, 27, 0.16);
      backdrop-filter: blur(18px);
    }

    .feature-card .label {
      font-size: 17px;
      color: rgba(17,19,18,0.48);
      font-weight: 600;
    }

    .feature-card .value {
      margin-top: 8px;
      font-size: 40px;
      color: #111312;
      font-weight: 760;
      line-height: 1.04;
    }

    .device-wrap {
      position: absolute;
      left: 188px;
      bottom: 150px;
      width: 926px;
      height: 1600px;
      z-index: 4;
      transform: rotate(-5deg);
      transform-origin: 50% 100%;
      filter: drop-shadow(0 64px 80px rgba(6, 14, 10, 0.25));
    }

    .device {
      position: absolute;
      left: 226px;
      top: 92px;
      width: 520px;
      height: 1126px;
      border-radius: 70px;
      background: linear-gradient(90deg, #0d0f0e, #3f4742 5%, #151716 11%, #090a09 90%, #78756a 96%, #161816);
      padding: 18px;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.16),
        inset 21px 0 38px rgba(255,255,255,0.10),
        inset -20px 0 36px rgba(0,0,0,0.72),
        0 46px 120px rgba(0,0,0,0.28);
    }

    .device::before {
      content: "";
      position: absolute;
      left: -11px;
      top: 226px;
      width: 12px;
      height: 104px;
      border-radius: 10px 0 0 10px;
      background: linear-gradient(180deg, #3c423e, #111412);
      box-shadow: 0 156px 0 #151816;
    }

    .device::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 338px;
      width: 10px;
      height: 150px;
      border-radius: 0 10px 10px 0;
      background: linear-gradient(180deg, #686a61, #1b1d1a);
    }

    .screen {
      width: 100%;
      height: 100%;
      border-radius: 52px;
      overflow: hidden;
      background: #fff;
      position: relative;
    }

    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .island {
      position: absolute;
      top: 26px;
      left: 50%;
      width: 154px;
      height: 45px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #050505;
      z-index: 9;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .lens {
      position: absolute;
      right: 28px;
      top: 42px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #405869, #040506 70%);
      z-index: 10;
    }

    .glass {
      position: absolute;
      inset: 18px;
      border-radius: 52px;
      background:
        linear-gradient(112deg, rgba(255,255,255,0.28), transparent 20%, transparent 70%, rgba(255,255,255,0.10)),
        linear-gradient(16deg, rgba(255,255,255,0.00), rgba(255,255,255,0.16) 46%, rgba(255,255,255,0.00) 58%);
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 11;
    }

    .compass-disc {
      position: absolute;
      left: 70px;
      bottom: 586px;
      width: 276px;
      height: 276px;
      border-radius: 50%;
      z-index: 7;
      background:
        radial-gradient(circle, rgba(255,255,255,0.96) 0 35%, rgba(236,222,184,0.94) 36% 38%, rgba(255,255,255,0.96) 39% 66%, rgba(186,151,75,0.86) 67% 70%, rgba(255,255,255,0.92) 71%),
        conic-gradient(from -15deg, rgba(180,148,80,0.25), rgba(17,19,18,0.08), rgba(180,148,80,0.22));
      box-shadow: 0 36px 74px rgba(22,21,17,0.22), inset 0 0 0 2px rgba(185,148,80,0.55);
    }

    .compass-disc::before {
      content: "";
      position: absolute;
      left: 137px;
      top: 36px;
      width: 4px;
      height: 202px;
      background: linear-gradient(180deg, #c51e1c 0 45%, #202521 45% 100%);
      transform: rotate(8deg);
      transform-origin: 50% 50%;
      border-radius: 99px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.4);
    }

    .compass-disc::after {
      content: "";
      position: absolute;
      left: 126px;
      top: 126px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #b99450;
      box-shadow: 0 0 0 7px rgba(255,255,255,0.72);
    }

    .bottom-band {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 460px;
      background: linear-gradient(180deg, rgba(255,255,255,0), rgba(8, 16, 13, 0.80));
      z-index: 2;
    }

    .footer {
      position: absolute;
      left: 94px;
      bottom: 82px;
      right: 94px;
      z-index: 6;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      color: rgba(255,255,255,0.84);
    }

    .footer .note {
      font-size: 20px;
      line-height: 1.45;
      max-width: 520px;
      color: rgba(255,255,255,0.72);
    }

    .footer .index {
      font-size: 18px;
      color: rgba(255,255,255,0.58);
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="orbital"></div>
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <span>TAME Space Compass</span>
        <small>探觅·空间罗盘</small>
      </div>
    </div>

    <section class="copy">
      <div class="eyebrow">罗盘坐向 · 户型参考</div>
      <h1>看清坐向<br>与空间关系</h1>
      <p class="sub">把罗盘读数、户型落点与本地记录收进一张清晰的现场参考图。</p>
      <div class="caption-row">
        <div class="caption">离线使用</div>
        <div class="caption light">本地记录</div>
        <div class="caption light">一次性解锁报告</div>
      </div>
    </section>

    <aside class="feature-card">
      <div class="label">当前方位参考</div>
      <div class="value">185° S</div>
    </aside>

    <div class="device-wrap">
      <div class="device">
        <div class="screen">
          <img src="../../VerificationShots/compass_pointer_to_marked_ring.png" alt="">
        </div>
        <div class="island"></div>
        <div class="lens"></div>
        <div class="glass"></div>
      </div>
      <div class="compass-disc"></div>
    </div>

    <div class="bottom-band"></div>
    <footer class="footer">
      <div class="note">仅作空间与民俗文化参考，不承诺现实结果。</div>
      <div class="index">01 / 06</div>
    </footer>
  </main>
</body>
</html>
