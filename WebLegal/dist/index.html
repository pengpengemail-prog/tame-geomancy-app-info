<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAME Space Compass WebLegal</title>
  <style>
    :root {
      --bg: #f5f1ea;
      --card: #ffffff;
      --ink: #111111;
      --muted: #666666;
      --line: rgba(17,17,17,0.08);
      --accent: #d7b86b;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #faf7f2 0%, var(--bg) 100%);
      color: var(--ink);
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 56px; }
    .hero, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 16px 36px rgba(17,17,17,0.06);
    }
    .hero {
      background: linear-gradient(135deg, #111 0%, #252525 100%);
      color: #fff;
      padding: 28px;
      margin-bottom: 18px;
    }
    .brand { font-size: 30px; font-weight: 800; letter-spacing: 0.08em; }
    .sub { margin-top: 8px; color: rgba(255,255,255,0.72); line-height: 1.7; }
    .card { padding: 22px; margin-bottom: 14px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    p, li, a { color: var(--muted); line-height: 1.75; }
    ul { margin: 0; padding-left: 18px; }
    a { text-decoration: none; }
    a:hover { text-decoration: underline; }
    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(215, 184, 107, 0.18);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="brand">TAME Space Compass</div>
      <h1>探觅·空间罗盘 WebLegal Bundle</h1>
      <p class="sub">本目录用于公开托管探觅·空间罗盘 / TAME Space Compass 所需的支持页、隐私政策与使用条款。</p>
    </section>

    <section class="card">
      <div class="pill">Links</div>
      <h2>公开页面入口</h2>
      <ul>
        <li><a href="./support.html">Support</a></li>
        <li><a href="./privacy-policy.html">Privacy Policy</a></li>
        <li><a href="./terms-of-use.html">Terms of Use</a></li>
      </ul>
    </section>
  </div>
</body>
</html>
